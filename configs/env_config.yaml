# §5 — Trading environment configuration
observation:
  window: 60  # Last 60 bars
  n_features: 32  # Will be overridden by actual feature count

contract:
  tick_size: 0.10
  tick_value: 10.0
  contract_size: 100
  starting_capital: 10000.0

risk:
  sl_tp:
    atr_sl: 1.5
    atr_tp: 3.0
  guard:
    max_drawdown_pct: 0.10
    min_account_floor: 5000.0
    max_trades_per_day: 10
    cooldown_bars: 5

friction:
  deterministic:
    spread_ticks: 2
    slippage_ticks: 1
    delay_bars: 0
    fill_prob: 1.0
    stop_slippage_ticks: 0
  domain_randomized:
    spread_ticks_range: [1, 4]
    slippage_ticks_range: [0, 3]
    delay_bars_range: [0, 2]
    fill_prob_range: [0.9, 1.0]
    stop_slippage_ticks_range: [0, 2]

splits:
  # Dataset spans 2023-01-18 → 2026-06-19 (1068 trading days)
  # Train: 2 years, Val: 9 months, Test: ~8 months (strictly future of train)
  train_start: "2023-01-18"
  train_end:   "2024-12-31"
  val_start:   "2025-01-01"
  val_end:     "2025-09-30"
  test_start:  "2025-10-01"
  test_end:    "2026-06-19"
